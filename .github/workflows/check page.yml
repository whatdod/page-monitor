name: Monitora pagine

on:
  schedule:
    # Ogni 15 minuti (GitHub può ritardare leggermente in caso di carico,
    # ma per questo scopo va benissimo)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permette di lanciarlo anche a mano dalla tab "Actions"
  repository_dispatch:
    types: [manual-check]  # attivato da cron-job.org ogni 15 minuti

permissions:
  contents: write

concurrency:
  group: page-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui controllo pagine
        env:
          TEAMS_WEBHOOK_TOSCANA: ${{ secrets.TEAMS_WEBHOOK_TOSCANA }}
          TEAMS_WEBHOOK_MASE: ${{ secrets.TEAMS_WEBHOOK_MASE }}
          # Aggiungi qui una riga per ogni nuova pagina, es:
          # TEAMS_WEBHOOK_NOMESITO: ${{ secrets.TEAMS_WEBHOOK_NOMESITO }}
        run: python check_page.py

      - name: Salva lo stato (commit se cambiato)
        run: |
          git config user.name "page-monitor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "Aggiorna stato pagine monitorate"
            git pull --rebase origin main
            git push
          else
            echo "Nessun cambiamento di stato da salvare."
          fi
